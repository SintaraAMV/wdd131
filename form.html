<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form - WDD 131 - Omar Lizandro Meza Ramirez</title>
    <meta name="description" content="WDD 131 product review form by Omar Lizandro Meza Ramirez. Rate a product, record the installation date, and submit a review.">
    <meta name="author" content="Omar Lizandro Meza Ramirez">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <p class="site-title">Product Review</p>
        <nav>
            <a href="index.html">Home</a>
            <a href="form.html" aria-current="page">Review Form</a>
        </nav>
    </header>

    <main>
        <h1>Product Review Form</h1>
        <p class="intro">Tell us about a product you installed. Fields marked with * are required.</p>

        <form action="review.html" method="get">
            <label for="product">Product name *</label>
            <select id="product" name="product" required>
                <option value="" disabled selected>*Select a Product ...*</option>
            </select>

            <fieldset>
                <legend>Overall rating *</legend>
                <div class="stars">
                    <input type="radio" id="rating1" name="rating" value="1" required>
                    <label for="rating1">&#9733;</label>
                    <input type="radio" id="rating2" name="rating" value="2" required>
                    <label for="rating2">&#9733;&#9733;</label>
                    <input type="radio" id="rating3" name="rating" value="3" required>
                    <label for="rating3">&#9733;&#9733;&#9733;</label>
                    <input type="radio" id="rating4" name="rating" value="4" required>
                    <label for="rating4">&#9733;&#9733;&#9733;&#9733;</label>
                    <input type="radio" id="rating5" name="rating" value="5" required>
                    <label for="rating5">&#9733;&#9733;&#9733;&#9733;&#9733;</label>
                </div>
            </fieldset>

            <label for="installDate">Date of installation *</label>
            <input type="date" id="installDate" name="installDate" required>

            <fieldset>
                <legend>Useful features</legend>
                <div class="checks">
                    <label><input type="checkbox" id="featureDurable" name="features" value="durable"> Durable</label>
                    <label><input type="checkbox" id="featureEasy" name="features" value="easy"> Easy to install</label>
                    <label><input type="checkbox" id="featureValue" name="features" value="value"> Good value</label>
                    <label><input type="checkbox" id="featureWorks" name="features" value="works"> Works as expected</label>
                    <label><input type="checkbox" id="featureLooks" name="features" value="looks"> Looks great</label>
                </div>
            </fieldset>

            <label for="writtenReview">Written review</label>
            <textarea id="writtenReview" name="writtenReview" rows="5"></textarea>

            <label for="userName">Your name</label>
            <input type="text" id="userName" name="userName" autocomplete="name">

            <input type="submit" value="Submit Review">
        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Omar Lizandro Meza Ramirez</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
