<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Desktop wireframe of the Temple Paths home page</title>
  <desc id="desc">Wide layout with horizontal navigation, hero, and three cards in one row.</desc>
  <rect width="960" height="560" fill="#f4f1ea"/>
  <rect x="16" y="16" width="928" height="528" fill="#ffffff" stroke="#102a43" stroke-width="3"/>
  <rect x="16" y="16" width="928" height="64" fill="#102a43"/>
  <rect x="36" y="38" width="150" height="16" rx="3" fill="#e9c46a"/>
