  <text x="640" y="54" fill="#ffffff" font-family="Arial, sans-serif" font-size="14">Temples</text>
  <text x="740" y="54" fill="#e9c46a" font-family="Arial, sans-serif" font-size="14">Plan a Visit</text>
  <text x="40" y="116" fill="#102a43" font-family="Georgia, serif" font-size="22">Home heading</text>
  <rect x="40" y="132" width="880" height="150" rx="6" fill="#d9cfc0" stroke="#102a43"/>
