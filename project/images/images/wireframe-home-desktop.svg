  <rect x="40" y="304" width="276" height="150" rx="6" fill="#ffffff" stroke="#102a43"/>
  <rect x="52" y="316" width="252" height="70" fill="#d9cfc0"/>
  <text x="120" y="412" fill="#102a43" font-family="Arial, sans-serif" font-size="14">Featured temple</text>
  <text x="128" y="432" fill="#243b53" font-family="Arial, sans-serif" font-size="12">name, country</text>
  <rect x="342" y="304" width="276" height="150" rx="6" fill="#ffffff" stroke="#102a43"/>
  <rect x="354" y="316" width="252" height="70" fill="#d9cfc0"/>
  <text x="422" y="412" fill="#102a43" font-family="Arial, sans-serif" font-size="14">Featured temple</text>
  <text x="430" y="432" fill="#243b53" font-family="Arial, sans-serif" font-size="12">name, country</text>
  <rect x="644" y="304" width="276" height="150" rx="6" fill="#ffffff" stroke="#102a43"/>
  <rect x="656" y="316" width="252" height="70" fill="#d9cfc0"/>
  <text x="724" y="412" fill="#102a43" font-family="Arial, sans-serif" font-size="14">Featured temple</text>
