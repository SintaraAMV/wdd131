  <text x="140" y="312" fill="#243b53" font-family="Arial, sans-serif" font-size="11">name, country</text>
  <rect x="46" y="360" width="268" height="88" rx="6" fill="#ffffff" stroke="#102a43"/>
  <rect x="58" y="372" width="72" height="48" fill="#d9cfc0"/>
