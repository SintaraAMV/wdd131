<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" role="img" aria-labelledby="title desc">
  <title id="title">Mobile wireframe of the Temple Paths home page</title>
  <desc id="desc">Narrow layout with header, hamburger, hero, three stacked cards, and footer.</desc>
