<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Paths - Temple Album</title>
    <meta name="description" content="Filterable album of Latter-day Saint temples from the Americas, Europe, and Oceania on Temple Paths.">
    <meta name="author" content="Omar Lizandro Meza Ramirez">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/templepaths.css">
    <script src="scripts/shared.js" defer></script>
    <script src="scripts/temples.js" defer></script>
</head>
<body>
    <header>
        <p class="site-title"><a href="index.html">Temple Paths</a></p>
        <button id="menu" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="primary-nav">☰</button>
        <nav id="primary-nav">
            <a href="index.html">Home</a>
            <a href="temples.html" aria-current="page">Temples</a>
            <a href="visit.html">Plan a Visit</a>
        </nav>
    </header>
    <main>
        <h1 id="album-heading">All temples</h1>
        <p class="lead">Nine temples from the Week 02 photo set. Filter by region or by dedication year.</p>
        <div class="filters" id="filters">
            <button type="button" data-filter="all" class="active">All</button>
            <button type="button" data-filter="americas">Americas</button>
            <button type="button" data-filter="europe">Europe</button>
            <button type="button" data-filter="oceania">Oceania</button>
            <button type="button" data-filter="new">New</button>
            <button type="button" data-filter="old">Old</button>
        </div>
        <div id="album" class="grid three"></div>
    </main>
    <footer>
        <p>&copy; <span id="currentyear"></span> Omar Lizandro Meza Ramirez</p>
        <p><a href="references.html">References</a></p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
